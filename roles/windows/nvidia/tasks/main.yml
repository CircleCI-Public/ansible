---
- name: Install NVIDIA Display Driver
  win_chocolatey:
    name: nvidia-display-driver
    state: '{{ package_state }}'
    force: true

- name: Create CUDA installer log directory
  ansible.windows.win_file:
    path: C:\cuda-logs
    state: directory

- name: Install CUDA Toolkit
  win_chocolatey:
    name: cuda
    state: '{{ package_state }}'
    version: '{{ cuda_version }}'
    install_args: '-log:C:\cuda-logs -loglevel:6'
    force: true

- name: Verify NVIDIA Installation
  ansible.windows.win_command:
    cmd: nvidia-smi
  register: nvidia_check
