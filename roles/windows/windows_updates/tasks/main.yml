- name: Install Critical, Security, and Update Rollups
  ansible.windows.win_updates:
    category_names: "*"
    reboot: no
    reboot_timeout: 7200
    reject_list:
      - 5019081
      - 4052623
      - 5034439
      - 2267602 # (maybe) causing an update loop
      - 890830 # (maybe) causing an update loop
      - 5070881 # (maybe) causing an update loop
      - 5007651 # (maybe) causing an update loop
      - 5120233 # Aug 2026 security update — reboots mid-install, breaks WinRM
      - 5120708 # Aug 2026 .NET security update — reboots mid-install, breaks WinRM
    skip_optional: true
  register: update_result

- name: Reboot after updates if required
  ansible.windows.win_reboot:
    reboot_timeout: 7200
    post_reboot_delay: 60
  when: update_result.reboot_required | default(false)
