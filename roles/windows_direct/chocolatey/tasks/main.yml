---
# Chocolatey stays on the image for customers (choco, refreshenv), but the
# build does not install anything with it. The MSI is the GitHub release, so
# this does not need the community feed either.
- name: Install Chocolatey
  ansible.builtin.include_tasks: 'roles/windows_direct/install/tasks/installer.yml'
  vars:
    pkg:
      name: Chocolatey
      url: '{{ chocolatey_url }}'
      checksum: '{{ chocolatey_sha256 }}'
      creates_path: 'C:\ProgramData\chocolatey\choco.exe'

- name: Enable Chocolatey Global Confirmation
  ansible.windows.win_command:
    cmd: 'C:\ProgramData\chocolatey\bin\choco.exe feature enable --name=allowGlobalConfirmation'

- name: Load Chocolatey Profile
  ansible.windows.win_powershell:
    script: |
      @'
      # Chocolatey profile
      $ChocolateyProfile = "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
      if (Test-Path($ChocolateyProfile)) {
          Import-Module $ChocolateyProfile
      }
      refreshenv >$null 2>&1
      '@ | Out-File -Encoding ascii "${PSHOME}\Microsoft.PowerShell_profile.ps1"
