# The same redistributables as the Chocolatey vcredist packages (x64 and
# x86). The .NET SDKs and Visual Studio need the v14 runtime first.
# 1638 (and 5100 for 2010) mean a same or newer version is already installed.
- name: Install vcredist 140 x64
  ansible.builtin.include_tasks: 'roles/windows_direct/install/tasks/installer.yml'
  vars:
    pkg:
      name: vcredist 140 x64
      url: '{{ vcredist140_x64_url }}'
      file: vcredist140_x64.exe
      checksum: '{{ vcredist140_x64_sha256 }}'
      args: '/install /quiet /norestart'
      return_codes: [0, 1638, 3010]

- name: Install vcredist 140 x86
  ansible.builtin.include_tasks: 'roles/windows_direct/install/tasks/installer.yml'
  vars:
    pkg:
      name: vcredist 140 x86
      url: '{{ vcredist140_x86_url }}'
      file: vcredist140_x86.exe
      checksum: '{{ vcredist140_x86_sha256 }}'
      args: '/install /quiet /norestart'
      return_codes: [0, 1638, 3010]

