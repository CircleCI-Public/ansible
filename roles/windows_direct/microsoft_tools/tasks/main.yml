- name: Install dotnet sdk 6
  ansible.builtin.include_tasks: 'roles/windows_direct/install/tasks/installer.yml'
  vars:
    pkg:
      name: dotnet sdk 6
      url: '{{ dotnet_sdk_6_url }}'
      checksum: '{{ dotnet_sdk_6_sha512 }}'
      checksum_algorithm: sha512
      args: '/install /quiet /norestart'
      creates_path: 'C:\Program Files\dotnet\sdk\{{ dotnet_sdk_6_version }}\dotnet.dll'

