- name: Install .NET Framework 4.8.1 via Windows Features
  ansible.windows.win_feature:
    name: NET-Framework-45-Features
    state: present
    include_sub_features: true
  when: "'Windows Server 2022' in ansible_distribution"

- name: Install Visual Studio 2022 Community Edition
  ansible.builtin.include_tasks: 'roles/windows_direct/install/tasks/installer.yml'
  vars:
    pkg:
      name: Visual Studio 2022 Community
      url: '{{ visualstudio_2022_community_url }}'
      checksum: '{{ visualstudio_2022_community_sha256 }}'
      args: '--allWorkloads --remove Microsoft.Net.Component.4.8.1.TargetingPack --remove Microsoft.Net.ComponentGroup.4.8.1.DeveloperTools --includeRecommended --includeOptional --nocache --quiet --wait --norestart --locale en-US'
      creates_path: 'C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\devenv.exe'

- name: Install Visual Studio 2022 Build Tools
  ansible.builtin.include_tasks: 'roles/windows_direct/install/tasks/installer.yml'
  vars:
    pkg:
      name: Visual Studio 2022 Build Tools
      url: '{{ visualstudio_2022_buildtools_url }}'
      checksum: '{{ visualstudio_2022_buildtools_sha256 }}'
      args: '--allWorkloads --remove Microsoft.Net.Component.4.8.1.TargetingPack --remove Microsoft.Net.ComponentGroup.4.8.1.DeveloperTools --includeRecommended --includeOptional --nocache --quiet --wait --norestart --locale en-US'
      creates_path: 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe'

- name: Install Visual Studio 2026 Build Tools
  ansible.builtin.include_tasks: 'roles/windows_direct/install/tasks/installer.yml'
  vars:
    pkg:
      name: Visual Studio 2026 Build Tools
      url: '{{ visualstudio_2026_buildtools_url }}'
      checksum: '{{ visualstudio_2026_buildtools_sha256 }}'
      args: '--allWorkloads --includeRecommended --includeOptional --nocache --quiet --wait --norestart --locale en-US'
      creates_path: 'C:\Program Files (x86)\Microsoft Visual Studio\18\BuildTools\MSBuild\Current\Bin\MSBuild.exe'

- name: Ensure that VS 2022 msbuild is in the path
  ansible.windows.win_path:
    elements:
    - 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin'

- name: Ensure that VS 2026 msbuild is in the path
  ansible.windows.win_path:
    elements:
    - 'C:\Program Files (x86)\Microsoft Visual Studio\18\BuildTools\MSBuild\Current\Bin'

- name: Ensure microsoft default java is not on path
  ansible.windows.win_path:
    elements:
      - 'C:\Program Files\Microsoft\jdk-11.0.16.101-hotspot\bin'
    state: absent

- name: Install Nuget command line interface
  ansible.builtin.include_tasks: 'roles/windows_direct/install/tasks/binary.yml'
  vars:
    pkg:
      name: nuget
      url: '{{ nuget_cli_url }}'
      checksum: '{{ nuget_cli_sha256 }}'

- name: Install Windows Application Driver
  ansible.builtin.include_tasks: 'roles/windows_direct/install/tasks/installer.yml'
  vars:
    pkg:
      name: winappdriver
      url: '{{ winappdriver_url }}'
      checksum: '{{ winappdriver_sha256 }}'
      creates_path: 'C:\Program Files (x86)\Windows Application Driver\WinAppDriver.exe'

- name: Disable Visual Studio background downloads
  win_regedit:
    path: HKLM:\Software\Microsoft\VisualStudio\Setup
    name: BackgroundDownloadDisabled
    data: 00000001
    type: dword
    state: present

# - name: Disable Visual Studio Update
