- name: Create the apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download the git-core PPA signing keys
  ansible.builtin.command:
    argv:
      - curl
      - --fail
      - --silent
      - --show-error
      - --location
      - --retry
      - "5"
      - --retry-all-errors
      - --output
      - "/etc/apt/keyrings/git-core-ppa-{{ item }}.asc"
      - "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x{{ item }}"
    creates: "/etc/apt/keyrings/git-core-ppa-{{ item }}.asc"
  loop: "{{ git_ppa_key_fingerprints }}"

- name: Check the downloaded keys have the expected fingerprints
  ansible.builtin.shell: >-
    gpg --show-keys --with-colons /etc/apt/keyrings/git-core-ppa-{{ item }}.asc | grep -q '^fpr:::::::::{{ item }}:'
  loop: "{{ git_ppa_key_fingerprints }}"
  changed_when: false

- name: Add git-core repository from PPA
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/git-core-ppa.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://ppa.launchpadcontent.net/git-core/ppa/ubuntu/
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: main
      Architectures: {{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}
      Signed-By: {% for fingerprint in git_ppa_key_fingerprints %}/etc/apt/keyrings/git-core-ppa-{{ fingerprint }}.asc{{ ',' if not loop.last else '' }}{{ ' ' if not loop.last else '' }}{% endfor %}
